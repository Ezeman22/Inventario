<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ABM Orden de Producción</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    th { background: #f4f4f4; }
    select, input, button { margin: 5px; padding: 5px; }
  </style>
</head>
<body>
  <h1>Órdenes de Producción</h1>

  <h2>Crear nueva orden</h2>
  <form id="formOrden">
    <label>Producto:</label>
    <select id="producto"></select>

    <label>Fórmula:</label>
    <select id="formula"></select>

    <label>Cantidad a producir:</label>
    <input type="number" id="cantidad" value="1" min="1">

    <button type="submit">Guardar Orden</button>
  </form>

  <h3>Detalle necesario</h3>
  <table id="tablaDetalle">
    <thead>
      <tr>
        <th>Componente</th>
        <th>Cantidad por unidad</th>
        <th>Total requerido</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Órdenes existentes</h2>
  <ul id="listaOrdenes"></ul>

  <script>
    let formulas = [];

    async function cargarProductos(){
      let res = await fetch("formulas.php?accion=productos");
      let data = await res.json();
      let sel = document.getElementById("producto");
      sel.innerHTML = "";
      data.forEach(p=>{
        let opt = document.createElement("option");
        opt.value = p.codigoproducto;
        opt.textContent = p.nombre;
        sel.appendChild(opt);
      });
      if(data.length>0) cargarFormulas(data[0].codigoproducto);
      sel.addEventListener("change", e=> cargarFormulas(e.target.value));
    }

    async function cargarFormulas(producto){
      let res = await fetch("formulas.php?producto="+producto);
      formulas = await res.json();
      let sel = document.getElementById("formula");
      sel.innerHTML = "";
      formulas.forEach(f=>{
        let opt = document.createElement("option");
        opt.value = f.nroformula;
        opt.textContent = f.nroformula+" (v"+f.version+")";
        sel.appendChild(opt);
      });
      mostrarDetalle();
      sel.addEventListener("change", mostrarDetalle);
      document.getElementById("cantidad").addEventListener("input", mostrarDetalle);
    }

    async function mostrarDetalle(){
      let nroformula = document.getElementById("formula").value;
      let cant = document.getElementById("cantidad").value;
      if(!nroformula) return;
      let res = await fetch("formulas.php?nroformula="+nroformula);
      let detalle = await res.json();
      let tbody = document.querySelector("#tablaDetalle tbody");
      tbody.innerHTML = "";
      detalle.forEach(d=>{
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.componentes}</td>
          <td>${d.cantidad}</td>
          <td>${(d.cantidad * cant).toFixed(2)}</td>`;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("formOrden").addEventListener("submit", async (e)=>{
      e.preventDefault();
      let producto = document.getElementById("producto").value;
      let nroformula = document.getElementById("formula").value;
      let cantidad = document.getElementById("cantidad").value;

      let res = await fetch("formulas.php?nroformula="+nroformula);
      let detalle = await res.json();

      let detalleCalc = detalle.map(d=>({
        componente: d.componentes,
        cantidad: d.cantidad * cantidad
      }));

      await fetch("ordenproduccion.php", {
        method:"POST",
        body: JSON.stringify({producto,nroformula,cantidad,detalle:detalleCalc})
      });

      alert("Orden creada correctamente");
      cargarOrdenes();
    });

    async function cargarOrdenes(){
      let res = await fetch("ordenproduccion.php");
      let data = await res.json();
      let lista = document.getElementById("listaOrdenes");
      lista.innerHTML = "";
      data.forEach(o=>{
        let li = document.createElement("li");
        li.innerHTML = `Orden #${o.id_orden} - Prod: ${o.producto} - Cant: ${o.cantidad} - Estado: ${o.estado}
          <button onclick="eliminarOrden(${o.id_orden})">Eliminar</button>`;
        lista.appendChild(li);
      });
    }

    async function eliminarOrden(id){
      if(!confirm("¿Eliminar orden "+id+"?")) return;
      await fetch("ordenproduccion.php", {
        method:"DELETE",
        body: JSON.stringify({id})
      });
      cargarOrdenes();
    }

    cargarProductos();
    cargarOrdenes();
  </script>
</body>
</html>
